version: 2

sources:
  - name: raw
    description: Raw event and application data landed from Postgres/CDC and Kafka.
    database: raw
    schema: default
    tables:
      - name: users
        description: Application users.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: email
            tests: [not_null]
          - name: created_at
            tests: [not_null]
      - name: tasks
        description: Video generation tasks.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: user_id
            tests: [not_null]
          - name: status
            tests: [not_null]
      - name: credit_transactions
        description: Credit ledger transactions.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: account_id
            tests: [not_null]
          - name: type
            tests: [not_null]
      - name: events
        description: Product events from Kafka.
        columns:
          - name: event_id
            tests: [not_null, unique]
          - name: event_type
            tests: [not_null]
          - name: occurred_at
            tests: [not_null]