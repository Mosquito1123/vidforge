{{- $data := dict }}
{{- range $key, $value := .Values.secrets }}
{{- if $value }}
{{- $_ := set $data $key $value }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-video.secretName" . }}
  labels:
    {{- include "ai-video.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
