{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-video.fullname" $ }}-{{ $name }}
  labels:
    {{- include "ai-video.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $svc.service.type }}
  selector:
    {{- include "ai-video.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
