## Nginx main config for the domestic (mainland China) deployment.
## Rendered by envsubst from infra/nginx/conf.d/*.conf before nginx starts.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Video uploads / generation artifacts. Keep in sync with the API limit.
    client_max_body_size 2048m;
    client_body_timeout  300s;

    # Generation requests can legitimately run for minutes.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering       off;
    proxy_request_buffering off;

    # WebSocket upgrade (socket.io task progress).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-IP API rate limit; tune for your traffic profile.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/vnd.apple.mpegurl image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
